<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Registration Form</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="form-wrapper">
            <div class="form-header">
                <h2><i class="fas fa-user-plus"></i> Create Account</h2>
                <p>Sign up to join our community</p>
            </div>

            <form id="myForm" novalidate>
                
                <div class="input-group" id="nameGroup">
                    <label for="name">Full Name</label>
                    <div class="input-container">
                        <i class="fas fa-user icon"></i>
                        <input type="text" id="name" placeholder="John Doe" autocomplete="off">
                        <i class="fas fa-check-circle success-icon"></i>
                        <i class="fas fa-exclamation-circle error-icon"></i>
                    </div>
                    <small class="error-msg" id="nameError"></small>
                </div>

                <div class="input-group" id="emailGroup">
                    <label for="email">Email Address</label>
                    <div class="input-container">
                        <i class="fas fa-envelope icon"></i>
                        <input type="email" id="email" placeholder="john@example.com" autocomplete="off">
                        <i class="fas fa-check-circle success-icon"></i>
                        <i class="fas fa-exclamation-circle error-icon"></i>
                    </div>
                    <small class="error-msg" id="emailError"></small>
                </div>

                <div class="input-group" id="passwordGroup">
                    <label for="password">Password</label>
                    <div class="input-container">
                        <i class="fas fa-lock icon"></i>
                        <input type="password" id="password" placeholder="Min. 6 characters">
                        <i class="fas fa-eye toggle-password" id="togglePassword"></i>
                        <i class="fas fa-check-circle success-icon"></i>
                        <i class="fas fa-exclamation-circle error-icon"></i>
                    </div>
                    <small class="error-msg" id="passwordError"></small>
                </div>

                <button type="submit" id="submitBtn">
                    <span>Register</span>
                    <i class="fas fa-arrow-right"></i>
                </button>

            </form>

            <div class="success-message" id="successMessage">
                 <i class="fas fa-check-circle"></i>
                 <p>Account created successfully!</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
